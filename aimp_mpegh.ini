; Settings for the MPEG-H 3D Audio plugin for AIMP.
; Keep this file next to aimp_mpegh.dll. Changes apply to the next track you start.

[MPEG-H]

; Output speaker layout:
;   stereo  - 2.0 (default; works on headphones and any sound card)
;   5.1     - L R C LFE Ls Rs
;   7.1     - L R C LFE + side and back surrounds
;   9.1.6   - 16 channels: L R C LFE Lb Rb Ls Rs Lw Rw + top front, top rear, top middle pairs
;             (needs a 16-channel output device; AIMP itself may refuse more than 8 channels)
;   mono
; A raw MPEG CICP layout number is also accepted (advanced, e.g. 10 = quad).
Layout=stereo

; Loudness normalisation target in LKFS, from -10 to -31.75.
; Leave empty for the decoder default (-24). Use -16 for a louder, "music player" level.
TargetLoudness=

; Dynamic range control effect. Leave empty for the default (off unless needed to avoid clipping).
;   -1 off   1 late night   2 noisy environment   3 limited playback range
;    4 low playback level   5 dialog enhancement   6 general compression
DrcEffect=

; 1 = the plugin reports title / artist / album etc. from the MP4 tags.
; 0 = leave tag reading entirely to AIMP (try this if tags or cover art look wrong).
ReadTags=1
